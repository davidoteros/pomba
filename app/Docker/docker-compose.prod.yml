services:

  # --- PROXY INVERSO ---
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3900:3900"
    env_file: .env.prod
    environment:
      # Solo sustituye las variables POMBA_*
      NGINX_ENVSUBST_FILTER: '^POMBA_'
    volumes:
      # Plantilla, no config: el entrypoint oficial de la imagen le pasa envsubst
      # al arrancar y escribe el resultado en /etc/nginx/conf.d/default.conf.
      - ../nginx/default.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - appnet

  # --- BACKEND DJANGO ---
  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - appnet

  # --- FRONTEND VUE ---
  frontend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.frontend.prod
    restart: unless-stopped
    networks:
      - appnet

  # --- POSTGRESQL ---
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- GARAGE S3 ---
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    # Se configura solo al arrancar: layout de un nodo, bucket y clave sacados del .env
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${AWS_STORAGE_BUCKET_NAME}
    volumes:
      - garage_meta:/var/lib/garage/meta
      # Los ficheros, en la carpeta o disco que elijas
      - ${POMBA_DATOS:-./datos}:/var/lib/garage/data
      - ./garage.prod.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin puertos: solo accesible por la red interna appnet
    networks:
      - appnet

  # --- ELASTICSEARCH (heap reducido para 4 GB RAM igual toca modificar) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - appnet

networks:
  appnet:

volumes:
  postgres_data:
  es_data:
  garage_meta:

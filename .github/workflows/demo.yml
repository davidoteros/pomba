# Compila la demo del frontend (backend falso en el navegador) y la publica en GitHub Pages
name: Demo en GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación cada vez; la nueva sustituye a la que esté a medias
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Dos trabajos, como las plantillas de GitHub: publicar busca el paquete ya subido (actions/deploy-pages#451)
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: app/frontend/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

# Compila la demo del frontend (backend falso en el navegador) y la publica en GitHub Pages
name: Demo en GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación cada vez; la nueva sustituye a la que esté a medias
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/frontend/dist
      - id: despliegue
        uses: actions/deploy-pages@v5
